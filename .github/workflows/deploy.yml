name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://sticker.jeremyxie.com
    env:
      NEXT_PUBLIC_APP_URL: https://sticker.jeremyxie.com
      CLOUDFLARE_ACCOUNT_ID: 9198bde6a94accd267e7ead951ed037e
      GOOGLE_AUTH_ENABLED: ${{ vars.GOOGLE_AUTH_ENABLED || 'false' }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      AUTH_REQUIRE_VERIFIED_EMAIL: ${{ vars.AUTH_REQUIRE_VERIFIED_EMAIL || 'false' }}
      CREDITS_COST_3X3: ${{ vars.CREDITS_COST_3X3 || '10' }}
      CREDITS_COST_4X4: ${{ vars.CREDITS_COST_4X4 || '15' }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Require migration confirmation when enabling verified email
        if: env.AUTH_REQUIRE_VERIFIED_EMAIL == 'true'
        env:
          CONFIRMED_MIGRATION: ${{ vars.AUTH_EMAIL_MIGRATION_CONFIRMED }}
        run: |
          if [ "$CONFIRMED_MIGRATION" != '20261123_verified_signup_bonus' ]; then
            echo '::error::Verify the production wallet migration before enabling email verification. See docs/ANTI_ABUSE.md.'
            exit 1
          fi
      - name: Run regression tests
        run: node --test tests/*.test.mjs
      - name: Build Worker and static pages
        env:
          CREDITS_SIGNUP_BONUS: ${{ vars.CREDITS_SIGNUP_BONUS }}
        run: |
          if [ -z "$CREDITS_SIGNUP_BONUS" ]; then unset CREDITS_SIGNUP_BONUS; fi
          npm run cf:build
      - name: Check types and deployment package
        run: |
          npm run typecheck
          npx wrangler deploy --dry-run
      - name: Deploy production
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is required."
            exit 1
          fi
          npm run cf:deploy -- -- --keep-vars --message "github-main-${GITHUB_SHA}"
      - name: Diagnose Cloudflare metadata reads
        if: failure() && steps.publish.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +x
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers"
          service="$base/services/sticker-studio/environments/production"
          probe() {
            local status
            status=$(curl --disable --silent --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 5 --max-time 15 --header @- "$2" \
              <<< "Authorization: Bearer $CLOUDFLARE_API_TOKEN") || status=000
            printf '%s: %s\n' "$1" "$status"
          }
          probe bindings "$service/bindings"
          probe custom-domains "$base/domains/records?page=0&per_page=5&service=sticker-studio&environment=production"
          probe custom-domains-page-one "$base/domains/records?page=1&per_page=5&service=sticker-studio&environment=production"
          probe subdomain "$service/subdomain"
          probe service-environment "$service"
          probe schedules "$base/scripts/sticker-studio/schedules"
      - name: Verify deployed pages and APIs
        run: npm run verify:deployment
